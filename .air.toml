root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./main"
  cmd = "make build"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "testdata", "node_modules", "web/static"]
  exclude_file = []
  # _templ.go files are build output, not source - templ generate rewrites
  # every one of them (new mtime) on every `make build`, even when the
  # source .templ didn't change. Without this exclusion, air watches those
  # rewrites as "changed" and rebuilds again, an unbounded self-triggering
  # loop. The real source of truth (.templ files) is still watched via
  # include_ext below, so editing one still triggers exactly one rebuild.
  exclude_regex = ["_test.go", "_templ.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "templ"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
